   name: Update EPG
   on:
     schedule:
       - cron: "0 5 * * *"
     workflow_dispatch: {}
     push:
       branches: [ main ]
   permissions:
     contents: write
   jobs:
     build:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-python@v5
           with:
             python-version: "3.12"
         - name: Build guide
           run: python merge_epg.py
         - name: Save guide
           run: |
             git config user.name "epg-bot"
             git config user.email "epg-bot@users.noreply.github.com"
             git add guide.xml
             git commit -m "Update EPG" || echo "No changes"
             git push
